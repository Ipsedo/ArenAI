fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v16.0.0
    hooks:
      - id: clang-format
        types_or: [ c++, c ]
  - repo: local
    hooks:
      - id: build
        name: build
        language: system
        entry: sh
        args: [ "./build_linux.sh" ]
        types: [ c++, c ]
        pass_filenames: false
        require_serial: true
      - id: tests
        name: tests
        language: system
        entry: ctest
        args: [ "--build-dir", "./build", "--output-on-failure" ]
        types: [ c++, c ]
        pass_filenames: false
        require_serial: true
